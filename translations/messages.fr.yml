    tour:
        next: "Suivant"
        previous: "Précédent"
        close: "Fermer la visite"
        end: "Terminer"
        skip: "Passer la visite"
        resume: "Reprendre la visite"
        progress: "Étape %d sur %d"
        replay: "Revoir la visite guidée"
        steps:
            welcome:
                title: "Bienvenue sur la Communauté RNF"
                body: "Cette visite vous emmène d’une page à l’autre : à chaque étape, l’élément dont on parle est entouré. Vous pouvez l’arrêter quand vous voulez, et la reprendre plus tard depuis vos paramètres."
            search:
                title: "Chercher, d’abord"
                body: "Cette barre cherche dans tout ce que vous avez le droit de lire : discussions, actualités, documents, pages et membres. C’est le chemin le plus court vers un compte rendu dont vous ne savez plus dans quel groupe il se trouve."
            account:
                title: "Votre compte est derrière votre nom"
                body: "Votre profil, vos groupes, vos discussions, vos notifications et vos réglages : tout ce qui vous concerne s’ouvre depuis ce menu, sur n’importe quelle page."
            groups:
                title: "Les groupes du réseau"
                body: "Un groupe par commission, par thématique ou par atelier. Les groupes publics se rejoignent d’un clic ; les groupes privés demandent l’accord d’un animateur."
                link: "Voir tous les groupes"
            groups_graph:
                title: "Les groupes vus comme un réseau"
                body: "Cette bascule montre les mêmes groupes sous forme de graphe : quel groupe dépend de quel autre, ce qui gravite autour d’une commission. Pratique pour situer un groupe dont vous n’aviez jamais entendu parler."
            create_group:
                title: "Créer un groupe"
                body: "Un besoin qui n’a pas encore son espace ? Vous pouvez créer un groupe vous-même, ouvert à tous ou sur demande d’adhésion. Il apparaît dans la liste une fois validé par l’équipe RNF."
            my_groups:
                title: "Vos groupes"
                body: "La liste de ceux que vous avez rejoints — c’est aussi la page sur laquelle vous arrivez à chaque connexion. Un groupe rejoint, c’est ses discussions et ses documents qui vous suivent."
                link: "Aller à mes groupes"
            group:
                title: "À l’intérieur d’un groupe"
                body: "Voici l’un de vos groupes. En haut : sa présentation, ses animateurs, ses membres, et le bouton pour le rejoindre ou le quitter."
                link: "Entrer dans un groupe"
            group_search:
                title: "Chercher dans ce groupe seulement"
                body: "La même recherche, limitée au groupe. Quand une commission a trois ans d’archives, c’est la différence entre retrouver et fouiller."
            discussions:
                title: "Les discussions"
                body: "Un sujet, puis des réponses. Chaque message part aussi par e-mail aux membres qui suivent le groupe, et vous pouvez répondre depuis votre boîte mail. Écrire « @ » suivi d’un nom prévient la personne, même si elle a mis le sujet en sourdine."
            articles:
                title: "Les actualités"
                body: "Pour annoncer : une date de réunion, un appel à contribution, un rapport qui vient de paraître. Ça se lit ; ce qui se débat va dans les discussions."
            documents:
                title: "Les documents"
                body: "Déposez un fichier, décrivez-le en une phrase, rangez-le dans un dossier et posez-lui des étiquettes. Chaque document a sa propre page, où l’on retrouve les discussions qui en parlent."
            pages:
                title: "Les pages"
                body: "Pour ce qui doit durer et se corriger au fil du temps : mode d’emploi, liste de contacts, compte rendu de référence. Chaque modification est conservée."
            members:
                title: "Les membres du groupe"
                body: "Qui est là, et qui l’anime. Les animateurs sont les référents du groupe : avec l’auteur d’un contenu, ce sont les seuls à pouvoir le modifier."
            documents_filters:
                title: "Retrouver un document"
                body: "Les filtres, à gauche : par type de fichier et par étiquette. Les étiquettes forment un vocabulaire commun à toute la plateforme, tenu par l’équipe RNF — pas des mots-clés libres qui deviennent des synonymes en six mois."
                link: "Ouvrir la bibliothèque du groupe"
            rights:
                title: "Qui peut modifier quoi"
                body: "Cette phrase est rappelée sur chaque onglet. Tout membre peut créer ; chacun modifie ensuite ce qu’il a déposé, et les animateurs peuvent corriger ou retirer n’importe quel contenu. Les discussions, elles, restent ouvertes à tous."
            directory:
                title: "L’annuaire et la carte"
                body: "Les membres du réseau, cherchables par nom, par compétence ou par territoire, et posés sur une carte. C’est ici qu’on trouve qui, ailleurs, a déjà traité le problème du jour."
                link: "Voir l’annuaire"
            profile:
                title: "Votre fiche"
                body: "Fonction, structure, réserves, téléphone : c’est ce que les autres verront de vous. Une fiche vide vous rend introuvable dans l’annuaire."
                link: "Compléter mon profil"
            notifications:
                title: "Ce qui vous attend"
                body: "Nouveaux messages, pages, documents, et les fois où quelqu’un vous a nommé : tout arrive ici, au même endroit."
                link: "Voir mes notifications"
            settings:
                title: "Vous décidez de ce que vous recevez"
                body: "Groupe par groupe et type de contenu par type de contenu, choisissez ce qui vous est envoyé par e-mail."
                link: "Régler mes notifications"
            rhythm:
                title: "À quel rythme"
                body: "Un e-mail à chaque message, un résumé quotidien, ou un résumé hebdomadaire le lundi. C’est ce réglage qui décide si la plateforme vous aide ou vous encombre."
            replay:
                title: "Revoir cette visite"
                body: "Ce lien la relance depuis le début, quand vous voulez. Une fois terminée, elle ne se rouvrira pas d’elle-même."
            end:
                title: "À vous de jouer"
                body: "C’est tout pour l’essentiel. Rejoignez un groupe et présentez-vous dans une discussion : c’est la meilleure façon de commencer."
