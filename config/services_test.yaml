# Services the test suite needs to replace by a double. Making them public is
# the only way for a functional test to swap them in the container.
services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\Service\EmailSender:
    public: true

  App\Service\NotificationSender:
    public: true

  App\Service\HashGenerator:
    public: true
    arguments:
      $secret: "%kernel.secret%"

  # Same reason as in dev: nothing must reach the Postmark API from a test.
  postmark_bulk:
    class: App\Postmark\LocalBulkTransport
    arguments: ["@mailer"]

  App\Service\DocumentFolderResolver:
    public: true
