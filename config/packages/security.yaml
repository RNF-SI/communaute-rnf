security:
    encoders:
        App\Entity\User:
            algorithm: bcrypt

    # https://symfony.com/doc/current/security.html#where-do-users-come-from-user-providers
    providers:
        # RNF external user provider
        rnf_user_provider:
            id: App\Security\RnfUserProvider
        # Legacy local user provider (for migration period)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        # Main application (with RNF auth)
        main:
            pattern: ^/
            provider: rnf_user_provider
            user_checker: App\Security\UserChecker
            anonymous: true
            guard:
                authenticators:
                    - App\Security\RnfAuthenticatorGuard
            entry_point: App\Security\RnfAuthenticatorGuard
            logout:
                path: user_logout
                target: homepage

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#firewalls-authentication

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/auth/login, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/auth/inscription, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/auth/api/login, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/user/login, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/user/register, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/user/forgotten-password, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/user/password-reset, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/$, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/app/.*/.*$, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        # Postmark posts replies-by-e-mail anonymously; the route is protected
        # by the secret key it carries. Without this the webhook is redirected
        # to the login page and no reply by e-mail ever reaches a discussion.
        - { path: ^/ws/list/inbound, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        # Followed by mail clients on the reader's behalf, without a session.
        - { path: ^/user/notifications/unsubscribe, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_USER, requires_channel: '%env(SECURE_SCHEME)%' }
