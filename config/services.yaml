# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
  plateform:
    name: "%env(string:PLATEFORM_NAME)%"
    from: "%env(string:POSTMARK_SENDER)%"
    analytics: "%env(bool:ANALYTICS_ENABLED)%"
  postmark:
    server_token: "%env(string:POSTMARK_SERVER_TOKEN)%"
    sender_signature: "%env(string:POSTMARK_SENDER)%"
    list_domain: "%env(string:POSTMARK_LIST_DOMAIN)%"
    inbound_key: "%env(string:POSTMARK_INBOUND_KEY)%"
    bulk_token: "%env(string:POSTMARK_BULK_TOKEN)%"
  # Hors requête HTTP — les commandes console, dont le résumé quotidien des
  # notifications — le routeur n'a aucun hôte à qui se référer et bâtit des
  # liens vers "localhost". Ces paramètres lui en donnent un. (#34)
  router.request_context.host: "%env(string:SITE_HOST)%"
  router.request_context.scheme: "%env(string:SECURE_SCHEME)%"
  router.request_context.base_url: ""

  # Répertoire des index de recherche, exposé pour que le contrôle
  # d'environnement puisse vérifier qu'il est accessible en écriture. (#14)
  search_index_dir: "%env(string:INDEX_DIR)%"

  google_recaptcha_site_key: "%env(GOOGLE_RECAPTCHA_SITE_KEY)%"
  google_recaptcha_secret_key: "%env(GOOGLE_RECAPTCHA_SECRET_KEY)%"

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: "../src/"
    exclude:
      - "../src/DependencyInjection/"
      - "../src/Entity/"
      - "../src/Kernel.php"
      - "../src/Tests/"
      - "../src/Migrations/"
      # Deux objets-valeurs, pas des services : ils portent un préfixe et un
      # titre, on les construit avec `new`. Les laisser dans l'autowiring
      # inviterait le conteneur à leur chercher des arguments qui n'existent
      # pas.
      - "../src/Service/Tagging/TagScanner.php"
      - "../src/Service/Tagging/TaggedThing.php"

  # controllers are imported separately to make sure services can be injected
  # as action arguments even if you don't extend any base controller class
  App\Controller\:
    resource: "../src/Controller/"
    tags: ["controller.service_arguments"]

  # add more service definitions when explicit configuration is needed
  # please note that last definitions always *replace* previous ones
  App\Doctrine\TablePrefix:
    arguments:
      $prefix: "%env(string:DATABASE_PREFIX)%"
    tags:
      - { name: doctrine.event_subscriber, connection: default }

  App\Service\AppFileManager:
    arguments:
      $projectDir: "%kernel.project_dir%"
      $assetPath: "%env(string:ASSET_DIR)%"

  App\Service\AppTextManager:
    arguments:
      $projectDir: "%kernel.project_dir%"

  App\EventSubscriber\UserLocaleSubscriber:
    arguments: ["%kernel.default_locale%"]

  # L'export « Liens utilisateurs-réserves » de GeoNature demande un jeton.
  # Sans lui le service se tait et le champ reste saisi à la main. (#28)
  App\Service\RnfReserves:
    arguments:
      $endpoint: "%env(string:RNF_AUTH_API_ENDPOINT)%"
      $token: "%env(string:RNF_EXPORT_TOKEN)%"
      $exportId: "%env(int:RNF_EXPORT_RESERVES_ID)%"

  # La connexion par mot de passe, éteinte par défaut. À n'allumer que là où
  # l'on doit entrer avec les comptes des données de test.
  App\Security\LoginFormAuthenticator:
    arguments:
      $enabled: "%env(string:FORM_LOGIN_ENABLED)%"

  App\Service\Community:
    arguments: ["%env(string:COMMUNITY_SLUG)%"]

  App\Service\DiscussionSender:
    arguments:
      $transport: "@postmark_bulk"
      $params: "%postmark%"

  # Même transport en lot que les discussions, mais l'adresse d'expédition de
  # la plateforme : on ne répond pas à une page. (#40)
  App\Service\ContentSender:
    arguments:
      $transport: "@postmark_bulk"
      $params: "%plateform%"

  # Le transport des discussions porte le second jeton Postmark : la commande
  # de contrôle doit l'éprouver lui, pas le mailer par défaut. (#14)
  App\Command\MailCheckCommand:
    arguments:
      $bulk: "@postmark_bulk"

  App\Service\SearchEngineManager:
    arguments:
      $projectDir: "%kernel.project_dir%"
      $indexesPath: "%env(string:INDEX_DIR)%"
      $dbUrl: "%env(resolve:DATABASE_URL)%"
      $categoriesParameters:
        "discussions":
          propertyList: ["id", "discussion", "body", "author"]
          indexPropertyList: ["id", "body"]
          index: "discussions_messages.index"
          class: "DiscussionMessage"
        "actualites":
          propertyList: ["id", "title", "body", "usergroup", "slug"]
          indexPropertyList: ["id", "title", "body"]
          index: "articles.index"
          class: "Article"
        "pages":
          propertyList: ["id", "title", "body", "usergroup", "slug"]
          indexPropertyList: ["id", "title", "body"]
          index: "pages.index"
          class: "Page"
        "documents":
          propertyList: ["id", "title", "description", "usergroup"]
          indexPropertyList: ["id", "title", "description"]
          index: "documents.index"
          class: "Document"
        "membres":
          propertyList: ["id", "name", "presentation", "jobTitle", "organisation", "reserves"]
          indexPropertyList: ["id", "name", "presentation", "jobTitle", "organisation", "reserves"]
          index: "members.index"
          class: "User"
        "groups":
          indexPropertyList: ["id", "name", "description", "presentation"]
          index: "groups.index"
          class: "Usergroup"

  App\DataFixtures\AppFixtures:
    arguments:
      $testAccountsEmail: "%env(string:TEST_ACCOUNTS_EMAIL)%"
      $communitySlug: "%env(string:COMMUNITY_SLUG)%"
      $environment: "%kernel.environment%"
      $allowFixtures: "%env(string:ALLOW_FIXTURES)%"

  App\Service\MailGuard:
    arguments:
      $environment: "%kernel.environment%"

  App\Service\HashGenerator:
    arguments:
      $secret: "%kernel.secret%"

  App\Util\Geocoder:
    public: true
    arguments:
      $params: "@parameter_bag"
  postmark:
    class: Postmark\Transport
    arguments:
      - "%env(string:POSTMARK_SERVER_TOKEN)%"
  postmark_bulk:
    class: App\Postmark\BulkTransport
    arguments:
      - "%env(string:POSTMARK_BULK_TOKEN)%"
