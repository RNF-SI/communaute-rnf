home:
  front:
    fileId: "front-hero.jpg"
  sur_titre: Bienvenue sur la Communauté RNF
  texte_principal: Animer et fédérer la communauté des réserves naturelles de France et leurs commissions.
  premier_texte: |
    <h2>Bienvenue sur la plateforme de la Communauté RNF !</h2>
    <p><strong>De quoi parle-t-on ?</strong> La plateforme de la Communauté RNF est l'outil collaboratif dédié aux <strong>Réserves Naturelles de France (RNF)</strong> et à leurs différentes commissions. Elle facilite les échanges, le partage d'expériences et la coordination entre tous les acteurs du réseau des réserves naturelles.
    </p>
    <p>Que vous soyez gestionnaire de réserve naturelle, membre d'une commission scientifique, éducative ou technique, cette plateforme vous permet de participer activement à la vie du réseau RNF.
    </p>
    <p>Comment optimiser la gestion collaborative des réserves naturelles ? Comment favoriser les échanges entre commissions ? Comment mutualiser les expertises et les retours d'expérience ? C'est tout l'objet de cette communauté !
    </p>
    <h2>Pourquoi cette communauté ?</h2>
    <p>Le réseau des réserves naturelles françaises est riche de sa diversité et de l'expertise de ses acteurs. Pour être efficace, cette richesse doit être partagée et valorisée. La plateforme Communauté RNF permet d'avancer collectivement grâce à l'échange d'actualités, d'informations, de retours d'expérience, de documents techniques et de questionnements entre tous les membres du réseau.
    </p>
    <p>Développée pour répondre aux besoins de coordination et d'animation du réseau RNF, cette plateforme collaborative regroupe toutes les personnes impliquées dans la gestion et la protection des réserves naturelles : gestionnaires, scientifiques, animateurs de commissions, éducateurs à l'environnement, élus, partenaires techniques et financiers, bénévoles passionnés de nature.
    </p>
    <p>En résumé, la Communauté RNF, c'est <strong>un réseau dynamique et collaboratif qui facilite le partage de connaissances et d'expériences entre tous les acteurs des réserves naturelles de France</strong>.
    </p>
    <p>Nos valeurs communes et principes de fonctionnement sont inscrits dans <a href="/groups/communaute/pages/charte-de-la-plateforme">une charte que nous vous invitons à lire</a>.
    </p>
    <p>Intéressés par l'aventure ? <a href="/groups/communaute/pages/a-propos-de-la-communaute-rnf">Rejoignez la Communauté RNF ici ! C'est gratuit, libre et ouvert !</a>
    </p>  
    <h2>Que pouvez-vous y trouver ?</h2>

    <figure class="image threeImagesInSameLine">
    <img src="/media/layout/contacts_et_membres.svg" alt="">
    </figure>
    <p><a href="/groups/communaute/pages/a-propos-de-la-communaute-rnf">Les contacts des membres du réseau, via </a><a href="/members">l'annuaire</a></p>
    <figure class="image threeImagesInSameLine">
    <img src="/media/layout/listes_discussions.svg" alt="">
    </figure>
    <p>Des espaces de discussion pour échanger entre commissions et réserves</p>
    <figure class="image threeImagesInSameLine">
    <img src="/media/layout/ressources_prod.svg" alt="">
    </figure>
    <p>Des ressources, outils et productions collaboratives du réseau RNF</p><p>&nbsp;</p>
      
    <p>Cette plateforme est constituée de <a href="/groups/communaute/pages/a-propos-de-la-communaute-rnf">« groupes »</a> dédiés aux différentes commissions et thématiques du réseau RNF.<br />
    Vous pourrez rejoindre les groupes correspondant à vos missions et centres d'intérêt, puis échanger, partager vos idées, une actualité, un document, etc. avec les autres membres du groupe. Certains groupes sont ouverts, sans modération pour y entrer. D'autres sont privés (indiqués par un symbole cadenas) : un animateur validera ou non votre demande.
    </p>
    <p>Le groupe « Communauté » rassemble l'intégralité des membres de la plateforme, ainsi que les documents, pages et actualités qui peuvent intéresser tous les participants du réseau RNF.
    </p>
    <p>La plateforme est collaborative, ce qui signifie que vous êtes libre de créer du contenu ou de réagir. Vous pouvez même à votre tour <a href="/groups/new">créer un groupe si vous le souhaitez !</a></p>
    <ul>
    <li><a href="/groups/communaute/pages/tutoriels-d-utilisation-de-la-plateforme">Prise en main de la plateforme et de ses fonctionnalités.</a></li>
    </ul>
    <p><strong>Découvrir et comprendre <a href="/groups/communaute/pages/a-propos-du-reseau-rnf">le réseau des Réserves Naturelles de France</a></strong>.
    </p>

  premier_clique_visibility: true
  premier_clique_texte: Suivez les actualités du réseau
  premier_clique_bouton_texte: S'abonner à la newsletter
  premier_clique_lien: /groups/communaute/pages/newsletter

  second_texte: |
    <figure class="image reducedSize20"><img src="/media/layout/help.svg" alt=""></figure>
    <div>
    <h2>Comment s'inscrire ?</h2>
    <ul>
    <li>1. RDV en haut à droite puis cliquez sur le bouton vert « Connexion »</li>
    <li>2. Tapez votre adresse mail et choisissez un mot de passe</li>
    <li>3. Ouvrez le mail de confirmation d'inscription reçu sur votre boite mail</li>
    </ul>
    <p>Bienvenue en tant que membre de la <strong>Communauté RNF</strong> ! Vous pouvez par ailleurs <a href="/groups/communaute/pages/newsletter">vous inscrire à la newsletter pour suivre les actualités du réseau</a>.</p>
    </div>

  second_clique_visibility: true
  second_clique_texte: Vous participez à une commission RNF ?
  second_clique_bouton_texte: Rejoignez le groupe de votre commission !
  second_clique_lien: /groups
  troisieme_texte: |
    <ul>
    <li>Contacter le support de la plateforme : <a href="mailto:support@communaute-rnf.fr">support@communaute-rnf.fr</a></li>
    <li>Contacter l'équipe RNF : <a href="mailto:communaute-rnf@espaces-naturels.fr">communaute-rnf@espaces-naturels.fr</a></li>
    </ul>
